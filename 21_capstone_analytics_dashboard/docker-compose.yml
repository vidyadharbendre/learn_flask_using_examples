# Day 21 — the whole system: app + database + cache + proxy.
services:
  app:
    build: .
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in your environment}
      APP_DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/pulse
      APP_CACHE_TYPE: RedisCache
      APP_CACHE_REDIS_URL: redis://cache:6379/0
      # Shared storage, so the limit is global rather than per worker (Day 19 §6).
      APP_RATE_LIMIT_STORAGE: redis://cache:6379/1
      APP_LOG_FORMAT: json
    depends_on:
      db: { condition: service_healthy }   # not just service_started
      cache: { condition: service_started }
    expose: ["8000"]                        # not published: only nginx may reach it
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse            # development only
      POSTGRES_DB: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data   # a NAMED volume, or `down` deletes it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ../20_docker_and_production_deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
