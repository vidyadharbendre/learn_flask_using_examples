# =============================================================================
# Day 20 — docker compose: the whole system, locally
# =============================================================================
# This is the shape of a real deployment: an app behind a proxy, with a real
# database and a cache — the shared backends Days 06, 08 and 19 kept insisting
# on. Run it with:
#
#     docker compose up --build
#     curl -s http://localhost:8080/ | python -m json.tool
# =============================================================================

services:
  app:
    build: .
    environment:
      APP_ENV: production
      # In real deployments this comes from a secret manager, never from a file
      # in the repository. Compose reads ${SECRET_KEY} from your shell or a
      # .env file that is gitignored.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment}
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      REDIS_URL: redis://cache:6379/0
      TRUST_PROXY: "1"
      GUNICORN_WORKERS: "3"
    depends_on:
      # `service_healthy`, not just `service_started`. Without it the app starts
      # while Postgres is still initialising, fails to connect, and crash-loops.
      # "depends_on alone is not enough" is one of the most common compose
      # misunderstandings.
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped
    # Not published to the host: only nginx may reach the app. Publishing 8000
    # would let anyone bypass the proxy — and with it the rate limits, TLS and
    # request-size caps.
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app        # development only
      POSTGRES_DB: app
    volumes:
      # A NAMED VOLUME. Without it the database lives in the container's
      # writable layer and is destroyed by `docker compose down`. This is how
      # people lose their development data and conclude Docker "ate" it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    # Bound the memory and evict least-recently-used keys, so a growing cache
    # cannot consume the host. An unbounded Redis is a slow-motion outage.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # :ro — nginx has no reason to write to its own config.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./errors:/srv/errors:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
