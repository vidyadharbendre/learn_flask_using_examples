# =============================================================================
# Day 20 — nginx as the reverse proxy in front of gunicorn
# =============================================================================
# Why have a proxy at all when gunicorn can serve HTTP directly?
#
#   1. TLS termination — nginx handles certificates; the app never sees them.
#   2. Static files — served from disk without waking a Python worker at all.
#   3. Slow clients — nginx buffers a request that arrives over 30 seconds, so
#      gunicorn's worker is occupied for milliseconds instead. Without this, a
#      handful of deliberately slow clients can occupy every worker you have
#      (the classic "slowloris" attack).
#   4. Compression, connection limits, and request-size caps.
#   5. Serving a maintenance page when the app is down.
# =============================================================================

upstream app {
    # "app" is the service name from docker-compose.yml; Docker's embedded DNS
    # resolves it. Outside Docker this would be 127.0.0.1:8000.
    server app:8000;

    # Reuse connections to gunicorn instead of reconnecting per request.
    keepalive 32;
}

# Hide the nginx version from responses and error pages.
server_tokens off;

# Cap the request body. This is nginx's equivalent of MAX_CONTENT_LENGTH
# (Day 04/16) and it rejects an oversized upload before it ever reaches Python.
client_max_body_size 6m;

# Bound how long a client may take to send its request — the slowloris defence.
client_body_timeout 15s;
client_header_timeout 15s;

server {
    listen 80;
    server_name _;

    # ---- Static files: never touch Python -----------------------------------
    # A Python worker serving a CSS file is a worker not serving a request.
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Health checks: keep them out of the access log ----------------------
    location = /healthz {
        proxy_pass http://app;
        access_log off;
    }

    # ---- Everything else goes to the application ----------------------------
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        # THE HEADERS THAT MAKE ProxyFix WORK.
        # Without these the app sees every request as coming from nginx over
        # plain HTTP: wrong client IP in logs and rate limits, and http:// links
        # generated on an https:// site.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # MUST be longer than gunicorn's `timeout`, or nginx returns 504 while
        # gunicorn is still working — a "timeout" with no trace in the app log.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # Buffer slow clients here rather than in a gunicorn worker.
        proxy_buffering on;

        # Strip gunicorn's Server header (see shipit/__init__.py). The proxy is
        # the last thing to touch the response, so this is where it belongs.
        proxy_hide_header Server;
        add_header Server "web" always;
    }

    # A friendly page when every backend is down, instead of nginx's default.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /srv/errors;
        internal;
    }
}

# =============================================================================
# In production you would also have a TLS server block:
#
#   server {
#       listen 443 ssl http2;
#       ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#       ssl_protocols TLSv1.2 TLSv1.3;
#       ...same location blocks...
#   }
#
#   # and redirect plain HTTP to it
#   server { listen 80; return 301 https://$host$request_uri; }
#
# Use certbot (Let's Encrypt) for certificates, and automate renewal — an
# expired certificate takes the site down completely, especially once HSTS is
# in force.
# =============================================================================
