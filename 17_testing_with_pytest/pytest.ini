[pytest]
testpaths = tests

# --strict-markers turns a typo'd marker (@pytest.mark.slwo) into an ERROR
#   instead of a silently-ignored no-op. Always set it.
# -q keeps output short; add -v when you want a line per test.
# --tb=short trims tracebacks to the useful part.
addopts = -q --strict-markers --tb=short

# Every marker must be declared here (that is what --strict-markers enforces).
markers =
    slow: tests that take noticeable time; skip with `-m "not slow"`
    integration: tests that exercise several layers together
