{% macro render_field(field) %}
  <div class="form-row">
    {{ field.label }}
    {{ field(**{'aria-invalid': 'true' if field.errors else 'false'}) }}
    {% if field.errors %}
      <ul class="field-error">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
{% endmacro %}
