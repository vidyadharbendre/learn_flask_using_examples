# =============================================================================
# mypy configuration for learn_flask_using_examples
# =============================================================================
# Each example directory ships its own app.py / models.py, so a single
# `mypy .` fails with "Duplicate module named 'app'". Use ./typecheck.sh, which
# checks one example at a time.
#
# Why not --strict?
# -----------------
# Flask's ecosystem is only partly typed. `flask_login`, `flask_wtf` and
# several others ship no stubs, and their decorators are untyped — so --strict
# reports "Untyped decorator makes function X untyped" for every view in the
# application. That is noise, not signal: it says nothing about YOUR code.
#
# The settings below keep the checks that catch real bugs (every function must
# be annotated, no implicit Optional, unreachable code) while silencing the
# ones that only report the absence of third-party stubs.
# =============================================================================

[mypy]
# Your own functions must be annotated — this is the rule with real value.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_unreachable = False
strict_equality = True

# Third-party packages without stubs (flask_login, flask_wtf, flask_migrate…)
# would otherwise produce an import error per file.
ignore_missing_imports = True

# Untyped third-party decorators (@login_required, @app.route on some versions)
# "infect" the functions they wrap. The function itself IS annotated; only the
# decorator is not.
disable_error_code = untyped-decorator, no-any-return, misc

exclude = (?x)(__pycache__/ | /migrations/ | \.venv/)
